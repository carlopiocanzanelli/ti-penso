<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carlo ed Enza</title>
<meta name="theme-color" content="#211A3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carlo ed Enza">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --crepuscolo: #211A3A;  /* sfondo: cielo poco dopo il tramonto */
    --velluto: #2E2244;     /* messaggi ricevuti e campi */
    --vino: #8F4262;        /* messaggi inviati */
    --luna: #F4E4BC;        /* la luna: pulsante e pensieri */
    --inchiostro: #2A1F3D;  /* testo sopra la luna */
    --testo: #F6ECEE;
    --nebbia: #B3A2BD;
    --errore: #FF9FB0;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--crepuscolo);
    color: var(--testo);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--luna); outline-offset: 2px; }

  /* ---------- Accesso ---------- */
  .screen {
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 380px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
  }
  .hero-moon {
    width: 104px; height: 104px; margin: 0 0 22px 6px; color: var(--luna);
    filter: drop-shadow(0 0 22px rgba(244,228,188,.45)) drop-shadow(0 0 60px rgba(201,120,143,.35));
  }
  .hero-moon svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  h1 {
    font-family: var(--serif); font-style: italic; font-weight: 600;
    font-size: 3.6rem; line-height: 1; letter-spacing: -0.01em; margin: 0 0 28px;
  }
  #login h1 { font-size: 3.1rem; }
  input[type="checkbox"] { display: inline-block; width: 20px; height: 20px; margin: 0; accent-color: var(--vino); }
  input[type="date"], input[type="datetime-local"] { min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; min-height: 50px; }
  select, textarea {
    font-family: inherit;
    display: block; width: 100%; margin-top: 6px;
    background: var(--velluto); border: 1px solid transparent; border-radius: 16px; color: var(--testo);
    padding: 14px 16px; font-size: 16px;
  }
  textarea { resize: vertical; min-height: 84px; }
  select:focus, textarea:focus { border-color: var(--nebbia); outline: none; }
  .hint { color: var(--nebbia); margin: -12px 0 22px; }
  label { display: block; margin-bottom: 14px; color: var(--nebbia); font-size: .95rem; }
  input {
    display: block; width: 100%; margin-top: 6px;
    background: var(--velluto); border: 1px solid transparent; border-radius: 16px; color: var(--testo);
    padding: 14px 16px; font-size: 16px; /* 16px evita lo zoom su iPhone */
  }
  input::placeholder { color: var(--nebbia); }
  input:focus { border-color: var(--nebbia); outline: none; }
  .error { color: var(--errore); min-height: 1.4em; margin: 0 0 8px; }
  .primary {
    width: 100%; min-height: 54px; border: 0; border-radius: 27px;
    background: var(--luna); color: var(--inchiostro); font-weight: 700; font-size: 1.05rem; cursor: pointer;
  }
  .primary:active { transform: scale(.98); }

  /* ---------- Chat ---------- */
  #chat {
    display: flex; flex-direction: column; height: 100dvh;
    max-width: 640px; margin: 0 auto;
    padding-top: env(safe-area-inset-top);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px 8px;
  }
  .who { min-width: 0; }
  .counter {
    display: block; background: none; border: 0; margin: 2px 0 0; padding: 4px 0;
    color: var(--nebbia); font-size: .93rem; text-align: left; cursor: pointer; border-radius: 6px;
  }
  header h2 {
    margin: 0; font-family: var(--serif); font-style: italic; font-weight: 600;
    font-size: 2.1rem; line-height: 1.1; letter-spacing: 0;
  }
  .ghost { background: none; border: 0; color: var(--nebbia); padding: 10px; margin: -10px; cursor: pointer; border-radius: 10px; }

  /* ---------- Schede: Chat e Agenda ---------- */
  #tabs { display: flex; gap: 4px; margin: 6px 20px 8px; padding: 4px; background: var(--velluto); border-radius: 22px; }
  #tabs button {
    flex: 1 1 auto; min-height: 40px; border: 0; border-radius: 18px; background: none; padding: 0 5px;
    color: var(--nebbia); font-weight: 600; font-size: .83rem; line-height: 1.1; cursor: pointer;
  }
  #tabs button[aria-selected="true"] { background: var(--vino); color: var(--testo); }
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  #banner {
    margin: 0 16px 8px; padding: 12px 14px; border-radius: 16px;
    background: var(--velluto); color: var(--testo); font-size: .93rem;
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
  }
  #banner p { margin: 0; }
  .small {
    flex: none; min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px;
    background: var(--luna); color: var(--inchiostro); font-weight: 700; cursor: pointer;
  }

  #messages {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 16px 16px;
  }
  .empty {
    margin: auto; text-align: center; max-width: 250px; color: var(--nebbia);
    font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.3;
  }
  .day { align-self: center; margin: 14px 0 6px; color: var(--nebbia); font-size: .82rem; }

  .msg {
    max-width: 80%; padding: 9px 14px 7px; border-radius: 20px;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .msg .t { display: block; margin-top: 2px; text-align: right; font-size: .72rem; color: var(--nebbia); }
  .msg.mine   { align-self: flex-end;   background: var(--vino);    border-bottom-right-radius: 6px; }
  .msg.theirs { align-self: flex-start; background: var(--velluto); border-bottom-left-radius: 6px; }
  .msg.mine .t { color: #EBD0DA; }

  /* Il "pensiero": la luna, usata solo qui e sul pulsante */
  .thought {
    align-self: center; display: flex; align-items: center; gap: 9px;
    margin: 10px 0; color: var(--luna);
  }
  .thought .moon {
    width: 20px; height: 20px; flex: none; color: var(--luna);
    filter: drop-shadow(0 0 7px rgba(244,228,188,.75));
  }
  .thought .moon svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .thought .tx { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.2rem; }
  .thought .t { color: var(--nebbia); font-size: .75rem; }
  .thought.mine { color: var(--nebbia); }
  .thought.mine .moon { color: var(--nebbia); filter: none; }

  footer { padding: 8px 16px max(14px, env(safe-area-inset-bottom)); }
  #msg-form { display: flex; gap: 8px; margin-bottom: 12px; }
  #msg-form input { margin: 0; border-radius: 26px; padding: 13px 18px; }
  .send {
    flex: none; width: 48px; height: 48px; border: 0; border-radius: 50%;
    background: var(--velluto); color: var(--testo); cursor: pointer;
    display: grid; place-items: center;
  }
  .send:active { background: var(--vino); }
  .send svg { width: 22px; height: 22px; }

  .think {
    position: relative; width: 100%; min-height: 64px; border: 0; border-radius: 32px;
    background: var(--luna); color: var(--inchiostro);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 1.75rem; line-height: 1;
    cursor: pointer;
    box-shadow: 0 0 44px rgba(244,228,188,.26), 0 0 90px rgba(201,120,143,.20);
    transition: transform .12s ease, opacity .2s ease;
  }
  .think svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  .think:active { transform: scale(.985); }
  .think[aria-disabled="true"] { opacity: .6; }
  .think .ring {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    border: 2px solid var(--luna);
    animation: ring 1s ease-out forwards;
  }
  @keyframes ring {
    from { transform: scale(1);    opacity: .9; }
    to   { transform: scale(1.2, 1.9); opacity: 0; }
  }

  /* ---------- Agenda ---------- */
  #agenda { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px 16px 16px; }
  .next { padding: 16px 18px; border-radius: 22px; background: var(--velluto); margin-bottom: 8px; }
  .next .lbl { color: var(--nebbia); font-size: .88rem; }
  .next .k { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.7rem; line-height: 1.15; margin: 2px 0 4px; }
  .next .w { color: var(--testo); font-size: .95rem; }
  .agenda-day { margin: 18px 4px 6px; color: var(--nebbia); font-size: .85rem; }
  .ev {
    display: flex; gap: 14px; align-items: baseline; width: 100%; text-align: left;
    background: var(--velluto); border: 0; border-radius: 18px; padding: 12px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .ev .h { flex: none; min-width: 56px; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.3rem; }
  .ev .w { min-width: 0; }
  .ev .ttl { font-weight: 700; overflow-wrap: anywhere; }
  .ev .sub { color: var(--nebbia); font-size: .86rem; overflow-wrap: anywhere; white-space: pre-wrap; }
  .ev.past { opacity: .55; }
  .agenda-empty { text-align: center; color: var(--nebbia); font-family: var(--serif); font-style: italic; font-size: 1.3rem; margin: 26px auto; max-width: 260px; }
  .more { display: block; margin: 14px auto 0; padding: 10px 14px; color: var(--nebbia); background: none; border: 0; cursor: pointer; }

  dialog {
    border: 0; padding: 0; border-radius: 26px; background: var(--crepuscolo); color: var(--testo);
    width: min(92vw, 420px); max-height: 90dvh; overflow-y: auto;
  }
  dialog::backdrop { background: rgba(10, 6, 20, .72); }
  dialog form { padding: 22px 20px 18px; }
  dialog h3 { margin: 0 0 16px; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.9rem; line-height: 1.1; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--testo); }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn-sec {
    flex: 1; min-height: 48px; border-radius: 24px; background: none; cursor: pointer;
    border: 1px solid var(--nebbia); color: var(--testo); font-weight: 600;
  }
  .btn-sec.danger { color: var(--errore); border-color: var(--errore); }

  /* ---------- Capsula del tempo ---------- */
  #capsule-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 16px; }
  .cap-stage { display: flex; flex-direction: column; align-items: center; padding: 34px 0 4px; }
  #capsule { width: min(56vw, 200px); height: auto; overflow: visible; display: block; }
  #cap-lid { transform-box: view-box; transition: transform .8s cubic-bezier(.3, 1.25, .5, 1); }
  #capsule.open #cap-lid { transform: translate(68px, -74px) rotate(26deg); }
  #capsule.has-unread:not(.open) #cap-lid { transform: translate(15px, -14px) rotate(7deg); }
  #cap-inside { opacity: 0; transition: opacity .4s ease; }
  #capsule.open #cap-inside, #capsule.has-unread #cap-inside { opacity: 1; }
  #cap-glow { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .6s ease; }
  #capsule.has-sealed #cap-glow, #capsule.has-unread #cap-glow { opacity: .85; }
  #capsule.has-unread #cap-glow { animation: breathe 2.2s ease-in-out infinite; }
  #capsule.flash #cap-glow { animation: flash 1s ease-out; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes flash { 0% { opacity: .85; transform: scale(1); } 35% { opacity: 1; transform: scale(2); } 100% { opacity: .85; transform: scale(1); } }
  .cap-say { text-align: center; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 1.6rem; line-height: 1.15; margin: 18px 0 4px; }
  .cap-sub { text-align: center; color: var(--nebbia); font-size: .93rem; margin: 0 auto 6px; max-width: 300px; }
  .cap-h { margin: 22px 4px 8px; color: var(--nebbia); font-size: .85rem; }
  .cap-card { display: block; width: 100%; text-align: left; border: 0; border-radius: 20px; background: var(--velluto); color: inherit; padding: 14px 16px; margin-bottom: 8px; }
  .cap-card .who { font-weight: 700; }
  .cap-card .meta { color: var(--nebbia); font-size: .86rem; }
  .cap-card.sealed { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .cap-card.sealed .cbody { flex: 1; min-width: 0; }
  .cap-card .when { font-size: .95rem; margin: 2px 0; }
  .cap-card.unread { background: var(--vino); cursor: pointer; }
  .cap-card.unread .meta { color: #EBD0DA; }
  .cap-card .text { font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.3; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cap-card.reveal .text { animation: reveal .9s ease both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cap-remove { flex: none; background: none; border: 0; padding: 8px 0 8px 8px; color: var(--errore); font-size: .86rem; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 8px; }
  .chip { border: 1px solid var(--nebbia); background: none; color: var(--testo); border-radius: 18px; padding: 7px 12px; font-size: .86rem; cursor: pointer; }
  dialog .hint { margin: 6px 0 12px; font-size: .9rem; }

  /* ---------- Diario dei ricordi ---------- */
  .mem-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #mem-scroll, #album-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 16px; }
  .mem-title { margin: 8px 4px 0; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 2rem; line-height: 1.1; }
  .mem-sub { margin: 2px 4px 14px; min-height: 1.2em; color: var(--nebbia); font-size: .93rem; }
  #mem-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 14px; padding: 8px 4px 16px; }
  .polaroid {
    display: block; text-align: left; border: 0; padding: 8px 8px 10px; border-radius: 4px; cursor: pointer;
    background: var(--testo); color: var(--inchiostro); box-shadow: 0 10px 24px rgba(0, 0, 0, .38);
    transform: rotate(var(--tilt, 0deg)); transition: transform .2s ease;
  }
  .polaroid:nth-child(odd) { --tilt: -1.3deg; }
  .polaroid:nth-child(even) { --tilt: 1.1deg; }
  .polaroid:nth-child(3n) { --tilt: .4deg; }
  .polaroid:active { transform: rotate(0deg) scale(.98); }
  .polaroid .ph { aspect-ratio: 1; background: #3A2D5E; display: grid; place-items: center; overflow: hidden; border-radius: 2px; }
  .polaroid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .polaroid .ph svg { width: 34%; fill: #8A76B8; }
  .polaroid .cap { padding: 9px 2px 0; }
  .polaroid .n { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 1.25rem; line-height: 1.1; overflow-wrap: anywhere; }
  .polaroid .m { margin-top: 3px; color: #6B5A72; font-size: .78rem; line-height: 1.25; }
  #album-name { margin: 10px 4px 2px; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 2.2rem; line-height: 1.05; overflow-wrap: anywhere; }
  #album-when { margin: 2px 4px; color: var(--testo); }
  #album-count { margin: 0 4px 10px; color: var(--nebbia); font-size: .88rem; }
  #album-desc { margin: 8px 4px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .album-actions { display: flex; gap: 10px; margin: 0 0 14px; }
  .btn-sec.ready { background: var(--luna); color: var(--inchiostro); border-color: var(--luna); }
  .btn-sec:disabled { opacity: .6; }
  .upload { margin: 0 4px 12px; color: var(--nebbia); font-size: .9rem; }
  .upload .bar { height: 6px; border-radius: 3px; background: var(--velluto); overflow: hidden; margin-bottom: 6px; }
  .upload .bar i { display: block; height: 100%; width: 0; background: var(--vino); transition: width .3s ease; }
  #photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .tile { display: block; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--velluto); aspect-ratio: 1; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mem-empty { grid-column: 1 / -1; text-align: center; color: var(--nebbia); font-family: var(--serif); font-style: italic; font-size: 1.3rem; margin: 26px auto; max-width: 260px; }

  #viewer { width: 100vw; max-width: none; height: 100dvh; max-height: none; margin: 0; border-radius: 0; background: #0D0A18; }
  #viewer[open] { display: flex; flex-direction: column; }
  .v-top { display: flex; justify-content: space-between; align-items: center; padding: max(12px, env(safe-area-inset-top)) 16px 8px; color: var(--nebbia); }
  .v-top button { background: none; border: 0; color: var(--testo); font-size: 1.9rem; line-height: 1; padding: 4px 10px; cursor: pointer; }
  .v-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
  #v-img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .v-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(13, 10, 24, .55); border: 0; color: var(--testo); font-size: 2rem; width: 44px; height: 56px; border-radius: 12px; cursor: pointer; }
  #v-prev { left: 6px; } #v-next { right: 6px; }
  .v-bar { padding: 10px 16px max(14px, env(safe-area-inset-bottom)); }
  .v-more { display: flex; gap: 10px; margin-top: 10px; }
  #v-save:disabled { opacity: .55; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 150px);
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    background: var(--testo); color: var(--inchiostro);
    padding: 10px 16px; border-radius: 18px; font-size: .93rem; max-width: 86vw; text-align: center;
    transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .think .ring { animation: none; display: none; }
    #capsule.has-unread #cap-glow, #capsule.flash #cap-glow, .cap-card.reveal .text { animation: none; }
    #cap-lid, #cap-inside, #cap-glow { transition: none; }
    .think, #toast { transition: none; }
  }
</style>
</head>
<body>

<!-- Accesso -->
<main id="login" class="screen" hidden>
  <div class="hero-moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
  <h1>Carlo ed Enza</h1>
  <form id="login-form">
    <label>Email
      <input type="email" id="email" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="login-error" role="alert"></p>
    <button class="primary" type="submit">Entra</button>
  </form>
</main>

<!-- Primo accesso: scelta del nome -->
<main id="setup" class="screen" hidden>
  <h1>Come ti chiami?</h1>
  <p class="hint">Il tuo nome comparirà nelle notifiche che riceve l'altra persona.</p>
  <form id="setup-form">
    <label>Il tuo nome
      <input id="name" maxlength="30" autocomplete="given-name" required>
    </label>
    <p class="error" id="setup-error" role="alert"></p>
    <button class="primary" type="submit">Salva</button>
  </form>
</main>

<!-- Chat -->
<div id="chat" hidden>
  <header>
    <div class="who">
      <h2 id="partner-name">…</h2>
      <button id="counter" class="counter" type="button" hidden></button>
    </div>
    <button id="logout" class="ghost" type="button">Esci</button>
  </header>

  <div id="tabs" role="tablist">
    <button id="tab-chat" role="tab" type="button" aria-selected="true">Chat</button>
    <button id="tab-agenda" role="tab" type="button" aria-selected="false">Agenda</button>
    <button id="tab-capsule" role="tab" type="button" aria-selected="false">Capsula del tempo</button>
    <button id="tab-memories" role="tab" type="button" aria-selected="false">Ricordi</button>
  </div>

  <div id="banner" hidden>
    <p id="banner-text"></p>
    <button id="enable-push" class="small" type="button" hidden>Attiva notifiche</button>
  </div>

  <div id="pane-chat" class="pane">
  <div id="messages" aria-live="polite"></div>

  <footer>
    <form id="msg-form" autocomplete="off">

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const MOON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const state = { me: null, myName: null, partnerName: null, channel: null, seen: new Set(), lastDay: null };
let sb = null;

/* ---------- Utilità ---------- */

let toastTimer;
function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

function show(screen) {
  for (const id of ["login", "setup", "chat"]) $(id).hidden = id !== screen;
}

function dayLabel(d) {
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return "Oggi";
  if (d.toDateString() === yesterday.toDateString()) return "Ieri";
  return d.toLocaleDateString("it-IT", { day: "numeric", month: "long" });
}

function b64ToUint8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

function otherName() {
  return state.partnerName || "L'altra persona";
}

/* ---------- Avvio e accesso ---------- */

async function init() {
  const cfg = window.CONFIG || {};
  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes("INCOLLA_QUI")) {
    show("login");
    $("login-error").textContent = "Manca la configurazione: compila il file config.js.";
    return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker:", e));
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (state.me && e.data && e.data.tab) setTab(e.data.tab);
    });
  }

  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_OUT") { teardown(); show("login"); }
  });

  const { data } = await sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user);
  else show("login");
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sb) return;
  $("login-error").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value,
  });
  if (error) { $("login-error").textContent = "Email o password non corrette."; return; }
  await afterLogin(data.user);
});

async function afterLogin(user) {
  state.me = user;
  try {
    await loadProfiles();
    if (!state.myName) { show("setup"); $("name").focus(); return; }
    await startChat();
  } catch (err) {
    console.error(err);
    show("login");
    $("login-error").textContent = "Non riesco a collegarmi al server. Controlla config.js e lo schema del database.";
  }
}

async function loadProfiles() {
  const { data, error } = await sb.from("profiles").select("id,name");
  if (error) throw error;
  state.myName = data.find((p) => p.id === state.me.id)?.name ?? null;
  state.partnerName = data.find((p) => p.id !== state.me.id)?.name ?? null;
}

$("setup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("setup-error").textContent = "";
  const name = $("name").value.trim();
  if (!name) return;
  const { error } = await sb.from("profiles").upsert({ id: state.me.id, name });
  if (error) { $("setup-error").textContent = "Non sono riuscito a salvare il nome. Riprova."; return; }
  state.myName = name;
  await startChat();
});

$("logout").addEventListener("click", async () => {
  // Questo telefono smette di ricevere notifiche per l'account che esce
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
  } catch (_) { /* non è un problema */ }
  await sb.auth.signOut();
});

function teardown() {
  if (state.channel) { sb.removeChannel(state.channel); state.channel = null; }
  state.me = null; state.myName = null; state.partnerName = null;
  state.seen.clear(); state.lastDay = null;
  $("messages").replaceChildren();
}

/* ---------- Chat ---------- */

async function startChat() {
  show("chat");
  renderHeader();
  await syncMessages();

  state.channel = sb
    .channel("stanza")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async (payload) => {
      const m = payload.new;
      if (m.sender !== state.me.id && !state.partnerName) {
        await loadProfiles().catch(() => {});
        renderHeader();
      }
      addMessage(m);
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "events" }, () => {
      if (!$("pane-agenda").hidden) loadEvents();
    })
    .subscribe();

  refreshBanner();
  setTab(new URLSearchParams(location.search).get("tab") || "chat");
}

function renderHeader() {
  $("partner-name").textContent = state.partnerName || "In attesa dell'altra persona";
  renderCounter();
}

/* ---------- Contatore dei giorni insieme ---------- */

const TOGETHER_SINCE = new Date(2026, 7, 22); // 22 agosto 2026 (i mesi partono da 0)

function togetherInfo() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((today - TOGETHER_SINCE) / 86400000);
  let months = (today.getFullYear() - TOGETHER_SINCE.getFullYear()) * 12 + today.getMonth() - TOGETHER_SINCE.getMonth();
  if (today.getDate() < TOGETHER_SINCE.getDate()) months -= 1;
  const anchor = new Date(TOGETHER_SINCE.getFullYear(), TOGETHER_SINCE.getMonth() + Math.max(months, 0), TOGETHER_SINCE.getDate());
  const rest = Math.round((today - anchor) / 86400000);
  return { days, months, rest };
}

function renderCounter() {
  const el = $("counter");
  const { days } = togetherInfo();
  if (days < 0) { el.hidden = true; return; }
  el.textContent = days === 0 ? "Il primo giorno insieme"
                 : days === 1 ? "1 giorno insieme"
                 : `${days} giorni insieme`;
  el.hidden = false;
}

$("counter").addEventListener("click", () => {
  const { months, rest } = togetherInfo();
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const detail = months > 0 ? `: ${plural(months, "mese", "mesi")} e ${plural(rest, "giorno", "giorni")}` : "";
  toast("Insieme dal 22 agosto 2026" + detail);
});

async function syncMessages() {
  const { data, error } = await sb
    .from("messages")
    .select("id,sender,kind,body,created_at")
    .order("created_at", { ascending: false })
    .limit(100);
  if (error) { toast("Non riesco a caricare i messaggi."); return; }

  const list = $("messages");
  list.replaceChildren();
  state.seen.clear();
  state.lastDay = null;

  if (data.length === 0) {
    const p = document.createElement("p");
    p.id = "empty"; p.className = "empty";
    p.textContent = "Ancora nessun messaggio. Scrivi qualcosa o manda un pensiero.";
    list.appendChild(p);
    return;
  }
  data.reverse().forEach(addMessage);
}

function addMessage(m) {
  if (state.seen.has(m.id)) return;
  state.seen.add(m.id);
  $("empty")?.remove();

  const list = $("messages");
  const date = new Date(m.created_at);
  const mine = m.sender === state.me.id;

  const dayKey = date.toDateString();
  if (dayKey !== state.lastDay) {
    state.lastDay = dayKey;
    const d = document.createElement("div");
    d.className = "day";
    d.textContent = dayLabel(date);
    list.appendChild(d);
  }

  const time = date.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const el = document.createElement("div");

  if (m.kind === "thinking") {
    el.className = "thought " + (mine ? "mine" : "theirs");
    const dot = document.createElement("span"); dot.className = "moon"; dot.innerHTML = MOON_SVG;
    const txt = document.createElement("span"); txt.className = "tx";
    txt.textContent = mine ? "Hai mandato un pensiero" : `${otherName()} ti sta pensando`;
    const t = document.createElement("span"); t.className = "t"; t.textContent = time;
    el.append(dot, txt, t);
  } else {
    el.className = "msg " + (mine ? "mine" : "theirs");
    el.append(document.createTextNode(m.body || ""));
    const t = document.createElement("span"); t.className = "t"; t.textContent = time;
    el.append(t);
  }

  list.appendChild(el);
  list.scrollTop = list.scrollHeight;
}

async function send(kind, body) {
  const { data, error } = await sb
    .from("messages")
    .insert({ kind, body: body ?? null })
    .select("id,sender,kind,body,created_at")
    .single();
  if (error) {
    console.error(error);
    toast("Invio non riuscito. Controlla la connessione e riprova.");
    return null;
  }
  addMessage(data);
  // La notifica all'altra persona parte da qui
  sb.functions.invoke("send-push", { body: { message_id: data.id } }).then(({ error: fnErr }) => {
    if (fnErr) console.warn("Notifica non inviata:", fnErr);
  });
  return data;
}

$("msg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("msg");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.focus();
  const ok = await send("text", text);
  if (!ok) input.value = text;
});

let cooling = false;
$("think").addEventListener("click", async () => {
  if (cooling) return;
  cooling = true;
  const btn = $("think");
  btn.setAttribute("aria-disabled", "true");

  const ring = document.createElement("span");
  ring.className = "ring";
  btn.appendChild(ring);
  setTimeout(() => ring.remove(), 950);

  const ok = await send("thinking", null);
  toast(ok ? "Pensiero inviato" : "Pensiero non inviato");
  setTimeout(() => { cooling = false; btn.removeAttribute("aria-disabled"); }, ok ? 4000 : 500);
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.me && !$("chat").hidden) {
    renderCounter(); syncMessages();
    if (!$("pane-agenda").hidden) loadEvents();
    if (!$("pane-capsule").hidden) loadCapsule();
    if (!$("pane-memories").hidden) loadMemories();
  }
});

/* ---------- Schede ---------- */

const TABS = ["chat", "agenda", "capsule", "memories"];
function setTab(name) {
  if (!TABS.includes(name)) name = "chat";
  for (const t of TABS) {
    $("pane-" + t).hidden = t !== name;
    $("tab-" + t).setAttribute("aria-selected", String(t === name));
  }
  if (name === "agenda") loadEvents();
  else if (name === "capsule") loadCapsule();
  else if (name === "memories") loadMemories();
  else { const l = $("messages"); l.scrollTop = l.scrollHeight; }
}
for (const t of TABS) $("tab-" + t).addEventListener("click", () => setTab(t));

/* ---------- Agenda condivisa ---------- */

let events = [];
let showPast = false;
let editingId = null;
const pad = (n) => String(n).padStart(2, "0");
const toDateInput = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toLocalInput = (d) => `${toDateInput(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDay = (d) => d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
const fmtTime = (d) => d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
const REMIND = { 0: "all'ora dell'appuntamento", 15: "15 minuti prima", 60: "1 ora prima", 1440: "1 giorno prima" };

async function loadEvents() {
  const { data, error } = await sb.from("events").select("*").order("starts_at");
  if (error) { toast("Non riesco a caricare l'agenda."); return; }
  events = data;
  renderAgenda();
}

function nextSpecial() {
  const t = new Date();
  const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const at = (n) => new Date(TOGETHER_SINCE.getFullYear(), TOGETHER_SINCE.getMonth() + n, TOGETHER_SINCE.getDate());
  let n = 1;
  while (at(n) < today) n++;
  return { n, date: at(n), diff: Math.round((at(n) - today) / 86400000) };
}

function isPast(ev) {
  const start = new Date(ev.starts_at);
  const t = new Date();
  if (ev.all_day) {
    return new Date(start.getFullYear(), start.getMonth(), start.getDate()) < new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  return start < t;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function eventButton(ev) {
  const b = el("button", "ev" + (isPast(ev) ? " past" : ""));

  if (!ev.all_day) b.append(el("span", "h", fmtTime(new Date(ev.starts_at))));
  const w = el("span", "w");
  w.append(el("div", "ttl", ev.title));
  const sub = [];
  if (ev.all_day) sub.push("Tutto il giorno");
  if (ev.remind_min !== null && ev.remind_min !== undefined) sub.push("Promemoria " + REMIND[ev.remind_min]);
  if (ev.notes) sub.push(ev.notes);
  if (sub.length) w.append(el("div", "sub", sub.join("\n")));
  b.append(w);
  b.addEventListener("click", () => openEventForm(ev));
  return b;
}

function renderDays(list, root) {
  let last = null;
  for (const ev of list) {
    const d = new Date(ev.starts_at);
    const key = d.toDateString();
    if (key !== last) { last = key; root.append(el("div", "agenda-day", fmtDay(d))); }
    root.append(eventButton(ev));
  }
}

function renderAgenda() {
  const root = $("agenda");
  root.replaceChildren();

  const s = nextSpecial();
  const years = s.n % 12 === 0;
  const card = el("div", "next");
  card.append(el("div", "lbl", years ? "Prossimo anniversario" : "Prossimo mesiversario"));
  card.append(el("div", "k", years ? `${s.n / 12} ${s.n / 12 === 1 ? "anno" : "anni"} insieme` : `${s.n} ${s.n === 1 ? "mese" : "mesi"} insieme`));
  card.append(el("div", "w", (s.diff === 0 ? "È oggi! " : s.diff === 1 ? "Domani, " : `Tra ${s.diff} giorni, `) + fmtDay(s.date)));
  root.append(card);

  const upcoming = events.filter((e) => !isPast(e));
  const past = events.filter(isPast).reverse();
  if (upcoming.length === 0) root.append(el("p", "agenda-empty", "Nessun appuntamento in programma. Aggiungi il primo."));
  else renderDays(upcoming, root);

  if (past.length) {
    const more = el("button", "more", showPast ? "Nascondi i passati" : `Mostra i passati (${past.length})`);
    more.type = "button";
    more.addEventListener("click", () => { showPast = !showPast; renderAgenda(); });
    root.append(more);
    if (showPast) renderDays(past, root);
  }
}

/* ---------- Capsula del tempo ---------- */

let capsule = [];
let justOpened = null;
const fmtLong = (d) => d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
const seenKey = () => "capsule-seen:" + state.me.id;
function loadSeen() {
  try { return new Set(JSON.parse(localStorage.getItem(seenKey()) || "[]")); } catch (_) { return new Set(); }
}
function saveSeen(set) {
  try { localStorage.setItem(seenKey(), JSON.stringify([...set])); } catch (_) { /* non è un problema */ }
}
function daysFromToday(iso) {
  const d = new Date(iso), t = new Date();
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
}
const inDays = (n) => (n <= 0 ? "oggi" : n === 1 ? "domani" : `tra ${n} giorni`);

async function loadCapsule() {
  const { data, error } = await sb.from("capsule_view").select("*").order("open_at");
  if (error) { toast("Non riesco a caricare la capsula."); return; }
  capsule = data;
  renderCapsule();
}

function renderCapsule() {
  const seen = loadSeen();
  const sealed = capsule.filter((m) => !m.is_open).sort((a, b) => a.open_at.localeCompare(b.open_at));
  const opened = capsule.filter((m) => m.is_open).sort((a, b) => b.open_at.localeCompare(a.open_at));
  const unread = opened.filter((m) => !seen.has(m.id));
  const read = opened.filter((m) => seen.has(m.id));

  const svg = $("capsule");
  svg.classList.toggle("has-sealed", sealed.length > 0);
  svg.classList.toggle("has-unread", unread.length > 0);
  $("cap-glass").setAttribute("fill", sealed.length + unread.length > 0 ? "url(#glassOn)" : "url(#glassOff)");

  if (unread.length) {
    $("cap-say").textContent = unread.length === 1 ? "C'è un messaggio da aprire!" : `Ci sono ${unread.length} messaggi da aprire!`;
    $("cap-sub").textContent = unread.length === 1 ? "Toccalo qui sotto per leggerlo." : "Toccali qui sotto per leggerli.";
  } else if (sealed.length) {
    $("cap-say").textContent = sealed.length === 1 ? "1 messaggio sigillato" : `${sealed.length} messaggi sigillati`;
    const n = sealed[0];
    $("cap-sub").textContent = `Il prossimo si apre il ${fmtLong(new Date(n.open_at))}, ${inDays(daysFromToday(n.open_at))}.`;
  } else {
    $("cap-say").textContent = "La capsula è vuota";
    $("cap-sub").textContent = "Metti dentro il primo messaggio: si aprirà il giorno che scegli.";
  }

  const root = $("capsule-list");
  root.replaceChildren();
  const section = (title, cards) => {
    if (!cards.length) return;
    root.append(el("div", "cap-h", title));
    cards.forEach((c) => root.append(c));
  };
  section("Da aprire", unread.map((m) => openedCard(m, false)));
  section("Ancora sigillati", sealed.map(sealedCard));
  section("Già aperti", read.map((m) => openedCard(m, true)));
  justOpened = null;
}

const whoIs = (m) => (m.author === state.me.id ? "Scritto da te" : `Da ${state.partnerName || "l'altra persona"}`);

function sealedCard(m) {
  const c = el("div", "cap-card sealed");
  const body = el("div", "cbody");
  body.append(el("div", "who", whoIs(m)));
  body.append(el("div", "when", `Si apre il ${fmtLong(new Date(m.open_at))}, ${inDays(daysFromToday(m.open_at))}`));
  body.append(el("div", "meta", `Sigillato il ${fmtLong(new Date(m.created_at))}`));
  c.append(body);
  if (m.author === state.me.id) {
    const rm = el("button", "cap-remove", "Rimuovi");
    rm.type = "button";
    rm.addEventListener("click", () => removeCapsule(m.id));
    c.append(rm);
  }
  return c;
}

function openedCard(m, isRead) {
  const c = el(isRead ? "div" : "button", "cap-card" + (isRead ? "" : " unread") + (m.id === justOpened ? " reveal" : ""));
  if (!isRead) c.type = "button";
  c.append(el("div", "who", whoIs(m)));
  c.append(el("div", "meta", `Scritto il ${fmtLong(new Date(m.created_at))}, aperto il ${fmtLong(new Date(m.open_at))}`));
  if (isRead) c.append(el("div", "text", m.body || ""));
  else {
    c.append(el("div", "who", "Tocca per aprire"));
    c.addEventListener("click", () => {
      const seen = loadSeen(); seen.add(m.id); saveSeen(seen);
      justOpened = m.id;
      renderCapsule();
    });
  }
  return c;
}

function chipDate(kind) {
  const t = new Date();
  if (kind === "ann") {
    const d = new Date(t.getFullYear(), TOGETHER_SINCE.getMonth(), TOGETHER_SINCE.getDate());
    return d <= t ? new Date(t.getFullYear() + 1, d.getMonth(), d.getDate()) : d;
  }
  const first = new Date(t.getFullYear(), t.getMonth() + (kind === "m1" ? 1 : 6), 1);
  first.setDate(Math.min(t.getDate(), new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()));
  return first;
}

function sealAnimation() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return Promise.resolve();
  const svg = $("capsule"), letter = $("cap-letter");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  return (async () => {
    svg.classList.add("open");                       // il coperchio si solleva
    await wait(800);
    letter.style.opacity = 1;                        // la lettera scende dentro
    const anim = letter.animate([
      { transform: "translate(120px, -34px) rotate(-8deg)" },
      { transform: "translate(120px, 44px) rotate(0deg)", offset: 0.55 },
      { transform: "translate(120px, 180px) rotate(0deg)" },
    ], { duration: 1200, easing: "ease-in-out", fill: "forwards" });
    await anim.finished;
    letter.style.opacity = 0; anim.cancel();
    svg.classList.remove("open");                    // il coperchio si richiude
    await wait(700);
    svg.classList.add("flash");                      // l'oblò si illumina
    await wait(1000);
    svg.classList.remove("flash");
  })();
}

  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

async function signedUrls(paths) {
  const now = Date.now();
  const need = paths.filter((p) => !urlCache.has(p) || urlCache.get(p).exp < now + 60000);
  if (need.length) {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
    if (error) throw error;
    for (const d of data) if (d.signedUrl) urlCache.set(d.path, { url: d.signedUrl, exp: now + 3600e3 });
  }
  return paths.map((p) => (urlCache.get(p) ? urlCache.get(p).url : null));
}

/* ---- caricamento delle foto (ridimensionate prima dell'invio) ---- */

function decodeImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("immagine non leggibile")); };
    img.src = url;
  });
}

async function shrink(img, maxSide, quality) {
  const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", quality));
  if (!blob) throw new Error("conversione non riuscita");
  return { blob, w, h };
}

async function uploadOne(file) {
  const img = await decodeImage(file);
  const full = await shrink(img, 1920, 0.85);
  const thumb = await shrink(img, 480, 0.78);
  URL.revokeObjectURL(img.src);
  const base = `${curAlbum.id}/${crypto.randomUUID()}`;
  const store = sb.storage.from(BUCKET);
  const a = await store.upload(`${base}.jpg`, full.blob, { contentType: "image/jpeg" });
  if (a.error) throw a.error;
  const b = await store.upload(`${base}_t.jpg`, thumb.blob, { contentType: "image/jpeg" });
  if (b.error) { await store.remove([`${base}.jpg`]); throw b.error; }
  const { error } = await sb.from("memory_photos").insert({
    album_id: curAlbum.id, path: `${base}.jpg`, thumb_path: `${base}_t.jpg`, width: full.w, height: full.h,
  });
  if (error) { await store.remove([`${base}.jpg`, `${base}_t.jpg`]); throw error; }
  if (!curAlbum.cover_path) {
    curAlbum.cover_path = `${base}_t.jpg`;
    await sb.from("memory_albums").update({ cover_path: curAlbum.cover_path }).eq("id", curAlbum.id);
  }
}

$("add-photos").addEventListener("click", () => $("photo-input").click());
$("photo-input").addEventListener("change", async (e) => {
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length || !curAlbum) return;
  const st = $("upload-status"), bar = st.querySelector("i"), txt = st.querySelector("span");
  st.hidden = false;
  let ok = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    txt.textContent = `Carico la foto ${i + 1} di ${files.length}…`;
    bar.style.width = `${(i / files.length) * 100}%`;
    try { await uploadOne(files[i]); ok++; } catch (err) { console.error(err); fail++; }
  }
  bar.style.width = "100%";
  setTimeout(() => { st.hidden = true; bar.style.width = "0"; }, 700);
  toast(fail ? `${ok} foto caricate, ${fail} non riuscite` : `${ok} ${ok === 1 ? "foto caricata" : "foto caricate"}`);
  await loadPhotos();
  loadMemories();
});

/* ---- salvare le foto nella galleria ---- */

const slug = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "ricordo";
const fileName = (i) => `${slug(curAlbum.name)}-${i + 1}.jpg`;

async function saveToGallery(files) {
  // iPhone: il foglio di condivisione ha «Salva immagine», che la mette in Foto
  if (isIOS() && navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); return; }
    catch (e) { if (e.name === "AbortError") return; console.warn("Condivisione:", e); }
  }
  // Android e computer: scarico i file, che compaiono nella Galleria (cartella Download)
  for (const f of files) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    if (files.length > 1) await new Promise((r) => setTimeout(r, 500));
  }
  toast(files.length === 1 ? "Foto scaricata: la trovi nella Galleria" : `${files.length} foto scaricate`);
}

$("album-download").addEventListener("click", async () => {
  const btn = $("album-download");
  if (pendingFiles) {                                  // iPhone: secondo tocco = si apre il foglio «Salva»
    const files = pendingFiles;
    resetDownloadButton();
    await saveToGallery(files);
    return;
  }
  if (!photos.length) { toast("Non ci sono foto da scaricare."); return; }
  btn.disabled = true;
  let files = [];
  for (let i = 0; i < photos.length; i++) {
    btn.textContent = `Preparo ${i + 1} di ${photos.length}…`;
    const { data, error } = await sb.storage.from(BUCKET).download(photos[i].path);
    if (!error && data) files.push(new File([data], fileName(i), { type: "image/jpeg" }));
  }
  btn.disabled = false;
  if (!files.length) { resetDownloadButton(); toast("Non sono riuscito a scaricare le foto."); return; }
  if (isIOS() && navigator.canShare && navigator.canShare({ files })) {
    if (files.length > 60) { files = files.slice(0, 60); toast("Salvo le prime 60 foto: poi ripeti per le altre."); }
    pendingFiles = files;
    btn.textContent = `Salva ${files.length} foto nella galleria`;
    btn.classList.add("ready");
  } else {
    resetDownloadButton();
    await saveToGallery(files);
  }
});

/* ---- visualizzatore a schermo intero ---- */

async function showPhoto() {
  const p = photos[curIndex];
  if (!p) return;
  const token = ++viewToken;
  $("v-count").textContent = `${curIndex + 1} di ${photos.length}`;
  $("v-save").disabled = true;
  viewerFile = null;
  try {                                                 // subito la miniatura, poi la foto intera
    const [t] = await signedUrls([p.thumb_path]);
    if (t && token === viewToken) $("v-img").src = t;
  } catch (_) { /* non è un problema */ }
  const { data: blob, error } = await sb.storage.from(BUCKET).download(p.path);
  if (token !== viewToken) return;                      // nel frattempo hai cambiato foto
  if (error || !blob) { toast("Non riesco a caricare la foto."); return; }
  viewerFile = new File([blob], fileName(curIndex), { type: "image/jpeg" });
  if (viewerUrl) URL.revokeObjectURL(viewerUrl);
  viewerUrl = URL.createObjectURL(blob);
  $("v-img").src = viewerUrl;
  $("v-save").disabled = false;
}

function openViewer(i) {
  curIndex = i;
  $("v-img").removeAttribute("src");
  $("viewer").showModal();
  showPhoto();
}
function step(d) {
  if (photos.length < 2) return;
  curIndex = (curIndex + d + photos.length) % photos.length;
  showPhoto();
}
$("v-prev").addEventListener("click", () => step(-1));
$("v-next").addEventListener("click", () => step(1));
$("v-close").addEventListener("click", () => $("viewer").close());
$("viewer").addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
let touchX = null;
$("viewer").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$("viewer").addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
});

$("v-save").addEventListener("click", () => { if (viewerFile) saveToGallery([viewerFile]); });

$("v-cover").addEventListener("click", async () => {
  const p = photos[curIndex];
  if (!p) return;
  const { error } = await sb.from("memory_albums").update({ cover_path: p.thumb_path }).eq("id", curAlbum.id);
  if (error) { toast("Non sono riuscito a cambiare la copertina."); return; }
  curAlbum.cover_path = p.thumb_path;
  toast("Copertina aggiornata");
});

$("v-del").addEventListener("click", async () => {
  const p = photos[curIndex];
  if (!p || !confirm("Eliminare questa foto? Non si potrà recuperare.")) return;
  await sb.storage.from(BUCKET).remove([p.path, p.thumb_path]);
  const { error } = await sb.from("memory_photos").delete().eq("id", p.id);
  if (error) { toast("Non sono riuscito a eliminarla."); return; }
  photos.splice(curIndex, 1);
  if (curAlbum.cover_path === p.thumb_path) {
    curAlbum.cover_path = photos.length ? photos[0].thumb_path : null;
    await sb.from("memory_albums").update({ cover_path: curAlbum.cover_path }).eq("id", curAlbum.id);
  }
  toast("Foto eliminata");
  renderPhotos();
  if (!photos.length) $("viewer").close();
  else { curIndex = Math.min(curIndex, photos.length - 1); showPhoto(); }
  loadMemories();
});

/* ---------- Notifiche ---------- */

function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

async function savePushSubscription() {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8(CONFIG.VAPID_PUBLIC_KEY),
    });
  }
  const j = sub.toJSON();
  const { error } = await sb
    .from("push_subscriptions")
    .upsert({ user_id: state.me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: "endpoint" });
  if (error) throw error;
}

function refreshBanner() {
  const banner = $("banner"), text = $("banner-text"), btn = $("enable-push");
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone === true ||
                     window.matchMedia("(display-mode: standalone)").matches;
  btn.hidden = true;

  if (ios && !standalone) {
    text.textContent = "Per ricevere le notifiche su iPhone: tocca Condividi, poi «Aggiungi alla schermata Home» e apri l'app da lì.";
    banner.hidden = false; return;
  }
  if (!pushSupported()) {
    text.textContent = "Questo browser non supporta le notifiche.";
    banner.hidden = false; return;
  }
  if (Notification.permission === "granted") {
    banner.hidden = true;
    savePushSubscription().catch((e) => console.warn("Sottoscrizione push:", e));
    return;
  }
  if (Notification.permission === "denied") {
    text.textContent = "Le notifiche sono bloccate. Riattivale dalle impostazioni del telefono.";
    banner.hidden = false; return;
  }
  text.textContent = "Attiva le notifiche per sapere subito quando ti scrive o ti pensa.";
  btn.hidden = false;
  banner.hidden = false;
}

$("enable-push").addEventListener("click", async () => {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Notifiche non attivate."); refreshBanner(); return; }
    await savePushSubscription();
    toast("Notifiche attivate");
    refreshBanner();
  } catch (err) {
    console.error(err);
    toast("Non sono riuscito ad attivare le notifiche.");
  }
});

init();
</script>
